<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mini Search Engine</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 100px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    .search-box button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .results {
      margin-top: 30px;
    }

    .result-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .result-item h3 {
      margin: 0 0 5px 0;
      color: #1a0dab;
    }

    .result-item p {
      margin: 0;
      color: #545454;
      font-size: 14px;
    }

    .error {
      color: red;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🔍 Mini Search Engine</h1>

    <div class="search-box">
      <input type="text" id="query" placeholder="请输入搜索关键词..." />
      <button onclick="search()">搜索</button>
    </div>

    <div id="error" class="error"></div>
    <div id="results" class="results"></div>
  </div>

  <script>
    async function search() {
      const query = document.getElementById("query").value.trim();
      const resultsDiv = document.getElementById("results");
      const errorDiv = document.getElementById("error");

      resultsDiv.innerHTML = "";
      errorDiv.textContent = "";

      if (!query) {
        errorDiv.textContent = "请输入搜索关键词";
        return;
      }

      try {
        // 示例接口：假设后端返回 JSON
        // {
        //   results: [
        //     { title: "...", snippet: "...", url: "..." }
        //   ]
        // }
        const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          resultsDiv.innerHTML = "<p>没有找到相关结果</p>";
          return;
        }

        data.results.forEach(item => {
          const div = document.createElement("div");
          div.className = "result-item";

          div.innerHTML = `
            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
            <p>${item.snippet}</p>
          `;

          resultsDiv.appendChild(div);
        });
      } catch (err) {
        errorDiv.textContent = "搜索失败，请检查后端服务";
        console.error(err);
      }
    }
  </script>
</body>
</html>
